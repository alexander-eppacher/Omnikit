# Omnikit-Server mit HTTPS. Start: im Ordner „deploy“  →  cp .env.example .env  (ausfüllen)  →  docker compose up -d
services:
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      # Die Datenbank ist eine Datei im Volume „server-data“ (Sicherung: diese Datei kopieren)
      ConnectionStrings__Default: Data Source=/data/omnikit.db
      OMNIKIT_ADMIN_PASSWORD: ${OMNIKIT_ADMIN_PASSWORD:?OMNIKIT_ADMIN_PASSWORD in .env setzen (mindestens 12 Zeichen)}
      # Caddy steht davor und meldet dem Server, dass die Anfrage über HTTPS kam (nur setzen, wenn der Server selbst nicht erreichbar ist)
      Server__TrustProxy: "true"
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - server-data:/data
    # Bewusst kein „ports“: Der Server ist nur über Caddy (HTTPS) erreichbar

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"
      - "443:443"
    environment:
      OMNIKIT_DOMAIN: ${OMNIKIT_DOMAIN:?OMNIKIT_DOMAIN in .env setzen}
      OMNIKIT_TLS: ${OMNIKIT_TLS:-internal}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  server-data:
  caddy-data:
  caddy-config:
